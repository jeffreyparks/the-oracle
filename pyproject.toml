[project]
name = "the-oracle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jeffreyparks", email = "jeff@accolade.digital" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-ai==2.43.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlmodel>=0.0.42",
    "typer>=0.27.2",
]

[project.scripts]
the-oracle = "the_oracle:main"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=6.0.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

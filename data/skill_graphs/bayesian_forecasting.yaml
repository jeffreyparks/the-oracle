# Seed skill graph for The Oracle - domain: Bayesian Modeling and Forecasting
# Validated: DAG is acyclic, every prerequisite id exists, modules cover all objectives
# in prerequisite-respecting order. Generated 2026-09-13.
schema_version: 1
domain: bayesian_forecasting
title: Bayesian Modeling and Forecasting
description: A prerequisite DAG from probability foundations to production-grade probabilistic forecasting,
  with a deliberate bias toward time series, forecast evaluation, and decisions.
bloom_levels:
- remember
- understand
- apply
- analyze
- evaluate
- create
difficulty_scale: 1 = first exposure, 5 = advanced practitioner
stats:
  objective_count: 70
  module_count: 10
  misconception_count: 15
  total_est_minutes: 3925
  max_prerequisite_depth: 22
modules:
- id: m01_probability_foundations
  title: Probability Foundations and the Simulation Mindset
  goal: Build fluent probability language and the habit of answering questions by simulation, not formulas
    alone.
  objectives:
  - prob_sample_space_events
  - prob_conditional_independence
  - prob_random_variables
  - prob_expectation_variance
  - prob_common_distributions
  - prob_joint_marginal_transform
  - prob_mc_integration
  - tool_python_prob_stack
- id: m02_bayes_core
  title: Bayes' Theorem, Conjugacy, and Reading a Posterior
  goal: Update beliefs correctly by hand, and report posteriors in language that answers the real question.
  objectives:
  - bayes_theorem
  - bayes_likelihood_function
  - bayes_conjugacy
  - bayes_sequential_updating
  - bayes_credible_vs_confidence
  - bayes_posterior_summaries
- id: m03_priors_generative
  title: Priors, Generative Models, and Model Validation
  goal: Choose defensible priors, write full generative models, and prove the implementation is correct
    before trusting it.
  objectives:
  - prior_types
  - prior_elicitation
  - prior_predictive_checks
  - prior_sensitivity
  - gen_model_writing
  - gen_sbc_fake_data
- id: m04_computation
  title: 'Computation: MCMC and Variational Inference'
  goal: Understand and run the algorithms that make non-conjugate Bayesian inference possible.
  objectives:
  - mcmc_why_sampling
  - mcmc_markov_chains
  - mcmc_metropolis
  - mcmc_hmc_nuts
  - tool_ppl_fitting
  - tool_arviz_workflow
  - vi_basics
  - vi_advi_practice
- id: m05_diagnostics_ppc
  title: Diagnostics and Posterior Predictive Checking
  goal: Decide whether a fit is trustworthy, and whether the model can reproduce the features of the data
    you care about.
  objectives:
  - diag_trace_convergence
  - diag_rhat
  - diag_ess_mcse
  - diag_divergences
  - ppc_posterior_predictive
  - ppc_checks
  - ppc_residuals_misfit
- id: m06_regression
  title: 'Bayesian Regression: GLMs, Robustness, and Smooths'
  goal: Model a conditional mean honestly across outcome types, nonlinearity, outliers, and imperfect
    data.
  objectives:
  - reg_linear_bayesian
  - reg_glm_links
  - reg_robust_outliers
  - reg_interactions_nonlinearity
  - reg_splines_gams
  - reg_measurement_missing
- id: m07_hierarchical
  title: Hierarchical and Multilevel Models
  goal: Share strength across groups, and fix the sampling geometry that hierarchical models create.
  objectives:
  - hier_partial_pooling
  - mcmc_reparameterization
  - diag_workflow_triage
  - hier_varying_intercepts_slopes
  - hier_group_predictors
  - hier_nonnested_multilevel
- id: m08_model_comparison
  title: Model Comparison and Averaging
  goal: Compare models on expected out-of-sample predictive accuracy, and combine them rather than over-trusting
    one.
  objectives:
  - cmp_predictive_view
  - cmp_waic_loo
  - cmp_bayes_factors
  - cmp_stacking_averaging
- id: m09_time_series
  title: Bayesian Time Series and Structural Forecasting
  goal: Model time-dependent data with state space, seasonal, GP, and hierarchical structure, and produce
    honest predictive distributions.
  objectives:
  - ts_foundations
  - ts_ar_arima
  - ts_local_level_trend
  - ts_seasonality
  - ts_structural_bsts
  - ts_gaussian_processes
  - ts_intermittent_counts
  - ts_changepoints_regimes
  - ts_hierarchical_forecasting
  - ts_forecast_uncertainty
- id: m10_evaluation_decisions
  title: Forecast Evaluation, Decisions, and the Full Workflow
  goal: Prove a forecast is good with proper scores and calibration, turn it into decisions, and run the
    whole workflow end to end.
  objectives:
  - ts_backtesting
  - ts_scoring_rules
  - ts_calibration_sharpness
  - dec_loss_functions
  - dec_value_of_information
  - dec_causal_cautions
  - dec_communication
  - workflow_bayesian_end_to_end
  - forecast_capstone
objectives:
- id: prob_sample_space_events
  title: Sample Spaces, Events, and Probability Axioms
  description: State the Kolmogorov axioms and use them to compute probabilities of compound events.
  bloom: understand
  difficulty: 1
  est_minutes: 40
  prerequisites: []
  assessment_stems:
  - Given a two-dice experiment, write the sample space and compute P(sum is prime).
  - A student claims P(A or B) = P(A) + P(B) for any A, B. Give a counterexample and the correct rule.
  - Show that P(A^c) = 1 - P(A) follows from the axioms.
- id: prob_conditional_independence
  title: Conditional Probability and Independence
  description: Compute conditional probabilities and distinguish independence from conditional independence.
  bloom: apply
  difficulty: 2
  est_minutes: 50
  prerequisites:
  - prob_sample_space_events
  assessment_stems:
  - Two events are independent but not conditionally independent given C. Construct such a case.
  - From a 2x2 contingency table, compute P(disease | positive test) and interpret it.
  - Explain why 'A and B are independent' does not imply 'A and B are independent given C'.
- id: prob_random_variables
  title: Random Variables, PMFs, PDFs, and CDFs
  description: Distinguish discrete and continuous random variables and move between pmf/pdf, CDF, and
    quantiles.
  bloom: understand
  difficulty: 2
  est_minutes: 50
  prerequisites:
  - prob_sample_space_events
  assessment_stems:
  - Given a pdf f(x) = cx on [0,2], find c, the CDF, and the median.
  - Explain why a pdf value may exceed 1 but a pmf value may not.
  - Sketch the CDF of a mixture of a point mass at 0 and a Normal, and name where it is discontinuous.
- id: prob_expectation_variance
  title: Expectation, Variance, and Moments
  description: Compute and interpret expectations, variances, covariances, and the law of total expectation/variance.
  bloom: apply
  difficulty: 2
  est_minutes: 50
  prerequisites:
  - prob_random_variables
  assessment_stems:
  - Use the law of total variance to decompose the variance of a hierarchical two-stage draw.
  - Show E[XY] != E[X]E[Y] when X and Y are dependent, with a concrete example.
  - A forecaster reports a mean of 100 and sd of 40 for a strictly positive quantity. What does this imply
    about skew?
- id: prob_common_distributions
  title: The Common Distribution Families and Their Stories
  description: Match Bernoulli, Binomial, Poisson, Negative Binomial, Normal, Student-t, Beta, Gamma,
    and Dirichlet to the data-generating stories they encode.
  bloom: analyze
  difficulty: 2
  est_minutes: 60
  prerequisites:
  - prob_random_variables
  - prob_expectation_variance
  assessment_stems:
  - Counts of website errors per hour are overdispersed relative to Poisson. Name a better family and
    justify it from its story.
  - Why is the Beta the natural family for an unknown proportion, and the Gamma for an unknown rate?
  - Given four datasets, assign a likelihood family to each and defend the choice in one sentence.
- id: prob_joint_marginal_transform
  title: Joint Distributions, Marginalization, and Change of Variables
  description: Marginalize and condition in joint distributions and apply the Jacobian change-of-variables
    rule.
  bloom: apply
  difficulty: 3
  est_minutes: 60
  prerequisites:
  - prob_expectation_variance
  - prob_common_distributions
  assessment_stems:
  - Derive the density of Y = log X when X is LogNormal, showing the Jacobian term.
  - Given a bivariate Normal, derive the conditional mean and variance of X1 given X2.
  - Explain why marginalizing a nuisance parameter is not the same as fixing it at its mean.
- id: prob_mc_integration
  title: Monte Carlo Integration and the Law of Large Numbers
  description: Approximate expectations and tail probabilities with simulation and quantify Monte Carlo
    error.
  bloom: apply
  difficulty: 2
  est_minutes: 50
  prerequisites:
  - prob_expectation_variance
  assessment_stems:
  - Estimate P(X > 3) for a Student-t(4) by simulation and report the Monte Carlo standard error.
  - How many draws are needed so the MC standard error of a mean is below 1% of the posterior sd?
  - Why can any posterior summary be computed from draws without ever writing down the posterior density?
- id: tool_python_prob_stack
  title: 'Tooling: Python Probability Stack Setup'
  description: Set up and run a reproducible Bayesian workflow environment with NumPy, SciPy, a PPL, and
    ArviZ.
  bloom: apply
  difficulty: 1
  est_minutes: 40
  prerequisites:
  - prob_mc_integration
  assessment_stems:
  - Install a PPL and ArviZ in a fresh environment, then draw and plot 10,000 Beta(2,5) samples.
  - Set a seed so a sampling run is byte-reproducible, and show the evidence.
  - Convert raw sampler output into an ArviZ InferenceData object and inspect its groups.
- id: bayes_theorem
  title: Bayes' Theorem and the Anatomy of the Posterior
  description: Derive Bayes' theorem and identify prior, likelihood, evidence, and posterior in a worked
    inference.
  bloom: understand
  difficulty: 2
  est_minutes: 50
  prerequisites:
  - prob_conditional_independence
  - prob_common_distributions
  assessment_stems:
  - A test has 99% sensitivity and 95% specificity; prevalence is 0.1%. Compute P(disease | positive)
    and explain the surprise.
  - Label prior, likelihood, and normalizing constant in a written-out posterior, and say which one does
    not affect the shape.
  - Show algebraically why the posterior is unchanged if the likelihood is multiplied by a constant.
- id: bayes_likelihood_function
  title: The Likelihood Function and Its Interpretation
  description: Write a likelihood for an i.i.d. sample and explain why it is a function of parameters,
    not a probability over them.
  bloom: understand
  difficulty: 2
  est_minutes: 45
  prerequisites:
  - bayes_theorem
  assessment_stems:
  - Write the log-likelihood for n Bernoulli trials and find its maximizer.
  - A student says 'the likelihood of theta = 0.5 is 0.03, so there is a 3% chance theta is 0.5.' Correct
    them.
  - Explain why the likelihood need only be specified up to a constant in theta.
- id: bayes_conjugacy
  title: Conjugate Priors and Closed-Form Updating
  description: Derive and apply Beta-Binomial, Gamma-Poisson, and Normal-Normal conjugate updates.
  bloom: apply
  difficulty: 3
  est_minutes: 60
  prerequisites:
  - bayes_likelihood_function
  - prob_joint_marginal_transform
  assessment_stems:
  - Starting from Beta(2,2) and observing 7 successes in 10 trials, give the posterior and its 90% interval.
  - Derive the Normal-Normal posterior mean as a precision-weighted average of prior mean and data mean.
  - Show how a Gamma-Poisson posterior behaves as exposure time grows without bound.
- id: bayes_sequential_updating
  title: Sequential Updating and Exchangeability
  description: Show that batch and sequential Bayesian updates agree, and explain exchangeability as the
    modeling assumption behind i.i.d. likelihoods.
  bloom: analyze
  difficulty: 3
  est_minutes: 50
  prerequisites:
  - bayes_conjugacy
  assessment_stems:
  - Update a Beta prior one observation at a time and in one batch; prove numerically the posteriors match.
  - Give a dataset where exchangeability plainly fails and say what structure must be added.
  - State de Finetti's theorem informally and connect it to hierarchical models.
- id: bayes_credible_vs_confidence
  title: Credible Intervals vs Confidence Intervals
  description: Contrast Bayesian credible intervals (HDI, equal-tailed) with frequentist confidence intervals
    in coverage meaning.
  bloom: analyze
  difficulty: 3
  est_minutes: 45
  prerequisites:
  - bayes_conjugacy
  - prob_mc_integration
  assessment_stems:
  - Compute both an HDI and an equal-tailed interval for a skewed posterior and explain when they differ.
  - A colleague says 'the 95% CI means there is 95% probability the parameter is inside.' When is that
    true and when not?
  - Design a simulation showing a credible interval's frequentist coverage under a misspecified prior.
- id: bayes_posterior_summaries
  title: Posterior Summaries and Reporting
  description: Choose and report point estimates, intervals, and probability statements that answer the
    actual question asked.
  bloom: evaluate
  difficulty: 2
  est_minutes: 45
  prerequisites:
  - bayes_credible_vs_confidence
  assessment_stems:
  - Report P(effect > 0), P(effect > a practical threshold), and the HDI for one posterior, and say which
    the stakeholder needs.
  - When is the posterior mode a poor summary? Give a distribution where it misleads.
  - Rewrite a p-value-style conclusion as an honest posterior statement.
- id: prior_types
  title: 'Prior Types: Informative, Weakly Informative, and Flat'
  description: Distinguish informative, weakly informative, reference, and improper flat priors and say
    when each is appropriate.
  bloom: understand
  difficulty: 2
  est_minutes: 50
  prerequisites:
  - bayes_conjugacy
  assessment_stems:
  - Why is a Uniform(-1e6, 1e6) prior on a log-odds not 'uninformative'? Show its implied prior on the
    probability.
  - Give a weakly informative prior for a regression slope on standardized data and justify the scale.
  - Name a case where an improper prior yields an improper posterior.
- id: prior_elicitation
  title: Prior Elicitation and Scale Setting
  description: Turn domain knowledge and units into concrete prior distributions with defensible scales.
  bloom: create
  difficulty: 3
  est_minutes: 55
  prerequisites:
  - prior_types
  assessment_stems:
  - An expert says the effect is 'almost surely under 10 points.' Turn that into a prior and state the
    implied tail probability.
  - Standardize predictors and set slope priors; explain how the priors change if you un-standardize.
  - Elicit a prior for a positive scale parameter and defend Half-Normal vs Exponential vs Half-Cauchy.
- id: prior_predictive_checks
  title: Prior Predictive Checks
  description: Simulate data from the prior predictive distribution and reject priors that imply absurd
    data.
  bloom: evaluate
  difficulty: 3
  est_minutes: 55
  prerequisites:
  - prior_elicitation
  - prob_mc_integration
  - tool_python_prob_stack
  assessment_stems:
  - Simulate 200 prior predictive datasets for a logistic model and show the priors imply near-certain
    0/1 outcomes.
  - A height model's prior predictive contains negative heights. Diagnose which prior causes it and fix
    it.
  - Describe a prior predictive check for a Poisson regression with a log link and an offset.
- id: prior_sensitivity
  title: Prior Sensitivity Analysis
  description: Quantify how much conclusions move when the prior is changed, and report it honestly.
  bloom: evaluate
  difficulty: 3
  est_minutes: 50
  prerequisites:
  - prior_predictive_checks
  - bayes_posterior_summaries
  assessment_stems:
  - Refit a model under three priors and tabulate how the key posterior quantity shifts.
  - With n = 10,000, why does the prior usually stop mattering, and when does it still matter?
  - Show a case where prior sensitivity is high precisely because the data are weakly identifying.
- id: gen_model_writing
  title: Writing a Generative Model
  description: Express a scientific question as a full generative model in statistical notation and in
    PPL code.
  bloom: create
  difficulty: 3
  est_minutes: 60
  prerequisites:
  - bayes_likelihood_function
  - prior_elicitation
  - tool_python_prob_stack
  assessment_stems:
  - Write the full generative model, in math and code, for test scores nested in schools.
  - Given PPL code, back-translate it into complete statistical notation including all priors.
  - Simulate a dataset from your own model, then recover the known parameters and report bias.
- id: gen_sbc_fake_data
  title: Simulation-Based Calibration and Fake-Data Recovery
  description: Validate a model implementation by recovering known parameters and checking rank uniformity.
  bloom: evaluate
  difficulty: 4
  est_minutes: 60
  prerequisites:
  - gen_model_writing
  - prior_predictive_checks
  assessment_stems:
  - Run simulation-based calibration on a hierarchical model and interpret the rank histogram.
  - Your fake-data recovery is biased for one parameter only. List three candidate causes and how to test
    each.
  - Why does fake-data recovery test the code and the model but not the world?
- id: mcmc_why_sampling
  title: 'Why Sampling: Intractable Posteriors and High Dimensions'
  description: Explain why normalizing constants are intractable and why grid and quadrature methods fail
    in high dimensions.
  bloom: understand
  difficulty: 2
  est_minutes: 45
  prerequisites:
  - bayes_conjugacy
  - prob_mc_integration
  assessment_stems:
  - Estimate the number of grid points needed for a 20-parameter model at 50 points per axis.
  - Explain 'typical set' and why the posterior mode is not where the mass is in high dimensions.
  - Name two models where conjugacy fails and say why.
- id: mcmc_markov_chains
  title: Markov Chains, Stationarity, and Detailed Balance
  description: Explain how a Markov chain can have a target posterior as its stationary distribution.
  bloom: understand
  difficulty: 3
  est_minutes: 55
  prerequisites:
  - mcmc_why_sampling
  assessment_stems:
  - Verify detailed balance for a simple two-state chain and find its stationary distribution.
  - Why does MCMC output violate the independence assumption of plain Monte Carlo error formulas?
  - State the conditions (irreducibility, aperiodicity) needed for convergence and give a chain that fails
    one.
- id: mcmc_metropolis
  title: Metropolis-Hastings from Scratch
  description: Implement Metropolis-Hastings, tune the proposal, and explain the acceptance ratio.
  bloom: apply
  difficulty: 3
  est_minutes: 60
  prerequisites:
  - mcmc_markov_chains
  - tool_python_prob_stack
  assessment_stems:
  - Code a random-walk Metropolis sampler for a Beta-Binomial posterior and compare to the closed form.
  - Your acceptance rate is 2%. Diagnose the cause and fix it; then explain why 99% is also bad.
  - Show why the proposal density cancels when the proposal is symmetric.
- id: mcmc_hmc_nuts
  title: Hamiltonian Monte Carlo and NUTS
  description: Explain gradient-based sampling, leapfrog integration, step size, and tree depth, and why
    HMC scales better.
  bloom: analyze
  difficulty: 4
  est_minutes: 70
  prerequisites:
  - mcmc_metropolis
  - prob_joint_marginal_transform
  assessment_stems:
  - Explain the roles of step size and number of leapfrog steps, and what happens when each is wrong.
  - Why does HMC require a differentiable log density, and what does that forbid in your model?
  - Contrast NUTS's automatic trajectory length with fixed-length HMC and state the trade-off.
- id: mcmc_reparameterization
  title: 'Reparameterization: Centered vs Non-Centered'
  description: Recognize funnel geometry and reparameterize a model to make the posterior easier to sample.
  bloom: create
  difficulty: 4
  est_minutes: 60
  prerequisites:
  - mcmc_hmc_nuts
  - hier_partial_pooling
  assessment_stems:
  - Rewrite a centered hierarchical model in non-centered form and show the divergence count drop.
  - Plot the funnel for a small group-count model and explain why small tau causes divergences.
  - When is the centered parameterization actually the better choice?
- id: vi_basics
  title: 'Variational Inference: ELBO and Mean-Field'
  description: Explain VI as optimization of the ELBO and state what mean-field approximations distort.
  bloom: analyze
  difficulty: 4
  est_minutes: 60
  prerequisites:
  - mcmc_why_sampling
  - prob_joint_marginal_transform
  assessment_stems:
  - Derive the ELBO from the KL divergence and say which direction of KL is being minimized.
  - Explain why mean-field VI typically underestimates posterior variance; illustrate on a correlated
    Normal.
  - Given a 2M-row dataset with a deadline, argue for or against VI over NUTS.
- id: vi_advi_practice
  title: ADVI and Practical Variational Workflows
  description: Run automatic differentiation VI, diagnose its failure modes, and decide when to fall back
    to MCMC.
  bloom: apply
  difficulty: 4
  est_minutes: 50
  prerequisites:
  - vi_basics
  - tool_ppl_fitting
  assessment_stems:
  - Fit a model with ADVI and with NUTS and compare posterior means and sds; report where they diverge.
  - Interpret a non-converging ELBO trace and list two fixes.
  - Describe a diagnostic (e.g. importance-weighted check) that detects a bad variational approximation.
- id: tool_ppl_fitting
  title: 'Tooling: Fitting Models in a PPL (PyMC / Stan / NumPyro)'
  description: Specify, compile, and sample a model in at least one probabilistic programming language
    and read its output.
  bloom: apply
  difficulty: 3
  est_minutes: 70
  prerequisites:
  - gen_model_writing
  - mcmc_hmc_nuts
  assessment_stems:
  - Implement the same linear regression in two of PyMC, Stan, and NumPyro and confirm matching posteriors.
  - Read a sampler warning about maximum tree depth and state the concrete next action.
  - Explain what the PPL does with your prior statements at compile time.
- id: tool_arviz_workflow
  title: 'Tooling: ArviZ and InferenceData for Diagnostics and Plots'
  description: Use ArviZ InferenceData to store, diagnose, compare, and visualize Bayesian model output.
  bloom: apply
  difficulty: 2
  est_minutes: 50
  prerequisites:
  - tool_ppl_fitting
  assessment_stems:
  - Build an InferenceData with posterior, prior, log_likelihood, and posterior_predictive groups.
  - Produce a trace plot, rank plot, and forest plot for one model and say what each rules out.
  - Use ArviZ to compare two models and read the output table correctly.
- id: diag_trace_convergence
  title: Trace Plots, Warmup, and Convergence by Eye
  description: Read trace and rank plots to spot non-convergence, stuck chains, and insufficient warmup.
  bloom: analyze
  difficulty: 2
  est_minutes: 45
  prerequisites:
  - tool_arviz_workflow
  - mcmc_markov_chains
  assessment_stems:
  - Given four trace plots, rank them from healthy to broken and justify each call.
  - Why must warmup draws be discarded, and why is warmup not just 'burn-in'?
  - Two chains explore different modes. What does that say about the posterior and the model?
- id: diag_rhat
  title: R-hat and Between-Chain Agreement
  description: Compute and interpret split R-hat and explain what it can and cannot detect.
  bloom: analyze
  difficulty: 3
  est_minutes: 45
  prerequisites:
  - diag_trace_convergence
  assessment_stems:
  - All R-hat values are 1.00 but the model is wrong. Explain why R-hat did not catch it.
  - Why does R-hat require multiple chains with dispersed inits?
  - Interpret R-hat = 1.08 for one parameter and give the next three actions.
- id: diag_ess_mcse
  title: Effective Sample Size and Monte Carlo Standard Error
  description: Use bulk and tail ESS and MCSE to decide whether enough draws have been collected.
  bloom: evaluate
  difficulty: 3
  est_minutes: 50
  prerequisites:
  - diag_rhat
  - prob_mc_integration
  assessment_stems:
  - You have 4000 draws and bulk ESS 120. How many more draws are needed for MCSE below target?
  - Explain the difference between bulk ESS and tail ESS and which matters for a 99th percentile forecast.
  - Justify reporting posterior means to only two significant digits using MCSE.
- id: diag_divergences
  title: Divergences, Tree Depth, and Energy Diagnostics
  description: Diagnose HMC-specific pathologies and take the right corrective action.
  bloom: evaluate
  difficulty: 4
  est_minutes: 55
  prerequisites:
  - mcmc_hmc_nuts
  - diag_ess_mcse
  assessment_stems:
  - You get 47 divergences concentrated in one region. Describe the geometry and two fixes.
  - Interpret a BFMI warning and say what it implies about the model, not just the sampler.
  - Why is 'raise target_accept until divergences vanish' sometimes hiding a real problem?
- id: diag_workflow_triage
  title: 'Diagnostic Triage: A Decision Procedure'
  description: Apply an ordered checklist that turns sampler warnings into concrete model or code changes.
  bloom: create
  difficulty: 4
  est_minutes: 50
  prerequisites:
  - diag_divergences
  - mcmc_reparameterization
  - gen_sbc_fake_data
  assessment_stems:
  - Write your own triage flowchart from warnings to actions and defend the ordering.
  - A model has high R-hat, low ESS, and divergences at once. What do you fix first and why?
  - Distinguish a computation problem from a model problem given only diagnostic output.
- id: ppc_posterior_predictive
  title: The Posterior Predictive Distribution
  description: Define and simulate the posterior predictive distribution and distinguish it from the posterior
    of a parameter.
  bloom: apply
  difficulty: 3
  est_minutes: 50
  prerequisites:
  - bayes_posterior_summaries
  - prob_mc_integration
  - tool_arviz_workflow
  assessment_stems:
  - Simulate posterior predictive draws for a Poisson model and explain why they are wider than the posterior
    mean's spread.
  - State the integral that defines the posterior predictive and what is being marginalized out.
  - A stakeholder wants 'the interval for the next observation.' Which distribution do you use and why?
- id: ppc_checks
  title: Posterior Predictive Checking and Test Quantities
  description: Design test quantities that would expose the specific failures that matter, and read PPC
    plots.
  bloom: evaluate
  difficulty: 3
  est_minutes: 55
  prerequisites:
  - ppc_posterior_predictive
  assessment_stems:
  - Your model fits the mean but not the count of zeros. Choose a test quantity and show the misfit.
  - Explain a Bayesian p-value for a test quantity and why values near 0.5 are not proof of a good model.
  - Design three test quantities for a sales forecasting model, one per failure mode you fear.
- id: ppc_residuals_misfit
  title: Residual Analysis and Locating Misfit
  description: Use standardized and randomized-quantile residuals to find where and for whom a model fails.
  bloom: analyze
  difficulty: 3
  est_minutes: 50
  prerequisites:
  - ppc_checks
  assessment_stems:
  - Compute randomized quantile residuals for a negative binomial model and check uniformity.
  - Group residuals by a held-out covariate to reveal a missing interaction.
  - Why can raw residuals mislead for discrete or heteroskedastic outcomes?
- id: cmp_predictive_view
  title: Predictive Accuracy as the Comparison Target
  description: Frame model comparison as expected out-of-sample predictive accuracy rather than in-sample
    fit.
  bloom: understand
  difficulty: 3
  est_minutes: 45
  prerequisites:
  - ppc_checks
  assessment_stems:
  - Explain overfitting using expected log predictive density rather than 'too many parameters'.
  - Why does adding a predictor always improve in-sample fit but not necessarily prediction?
  - Define elpd in words and say what quantity it is an expectation over.
- id: cmp_waic_loo
  title: WAIC and PSIS-LOO Cross-Validation
  description: Compute WAIC and PSIS-LOO, interpret elpd differences with standard errors, and check Pareto
    k values.
  bloom: evaluate
  difficulty: 4
  est_minutes: 60
  prerequisites:
  - cmp_predictive_view
  - tool_arviz_workflow
  assessment_stems:
  - Two models differ by elpd_diff = 3.1 with se_diff = 4.0. What do you conclude?
  - Several Pareto k values exceed 0.7. Explain what that means and give two remedies.
  - Why is LOO invalid as written for time series, and what replaces it?
- id: cmp_bayes_factors
  title: Marginal Likelihood, Bayes Factors, and Their Hazards
  description: Compute and interpret Bayes factors while recognizing their extreme prior sensitivity.
  bloom: evaluate
  difficulty: 4
  est_minutes: 55
  prerequisites:
  - prior_sensitivity
  - cmp_waic_loo
  assessment_stems:
  - Show numerically how widening a prior by 10x changes a Bayes factor but barely changes the posterior.
  - Explain the Jeffreys-Lindley paradox in one paragraph with a concrete example.
  - When is a Bayes factor the right tool, and when is LOO the right tool?
- id: cmp_stacking_averaging
  title: Model Averaging, Stacking, and Ensembles
  description: Combine models by stacking or pseudo-BMA weights instead of picking a single winner.
  bloom: create
  difficulty: 4
  est_minutes: 50
  prerequisites:
  - cmp_waic_loo
  assessment_stems:
  - Compute stacking weights for three candidate forecasting models and interpret a zero weight.
  - Contrast stacking with Bayesian model averaging under an open-world assumption.
  - Show a case where an averaged forecast beats every individual model on log score.
- id: reg_linear_bayesian
  title: Bayesian Linear Regression
  description: Fit and interpret a Bayesian linear regression, including priors on coefficients and the
    residual scale.
  bloom: apply
  difficulty: 3
  est_minutes: 60
  prerequisites:
  - gen_model_writing
  - tool_ppl_fitting
  - prior_elicitation
  assessment_stems:
  - Fit a regression with standardized predictors, report coefficient posteriors, and interpret one in
    original units.
  - Explain what the posterior of sigma tells you that R-squared does not.
  - Add a redundant, highly collinear predictor and describe what happens to the coefficient posteriors.
- id: reg_glm_links
  title: Generalized Linear Models and Link Functions
  description: Build logistic, Poisson, and negative binomial regressions and interpret parameters on
    the correct scale.
  bloom: apply
  difficulty: 3
  est_minutes: 65
  prerequisites:
  - reg_linear_bayesian
  - prob_common_distributions
  assessment_stems:
  - Interpret a logistic coefficient of 0.7 as an odds ratio and as a probability change at two baselines.
  - Add an exposure offset to a Poisson model and explain why it is not a coefficient.
  - Data are overdispersed counts. Move from Poisson to negative binomial and show the effect on intervals.
- id: reg_robust_outliers
  title: Robust Regression and Heavy Tails
  description: Replace Normal likelihoods with Student-t or mixture likelihoods to limit outlier influence.
  bloom: apply
  difficulty: 3
  est_minutes: 45
  prerequisites:
  - reg_linear_bayesian
  - prob_common_distributions
  assessment_stems:
  - Refit a regression with a Student-t likelihood and compare slope posteriors to the Normal fit.
  - Explain why estimating nu rather than fixing it is often better, and what the posterior of nu tells
    you.
  - Contrast deleting outliers with modeling them; state the inferential cost of each.
- id: reg_interactions_nonlinearity
  title: Interactions, Polynomials, and Nonlinear Effects
  description: Model nonlinearity and effect modification, and interpret them via marginal effects.
  bloom: analyze
  difficulty: 3
  est_minutes: 50
  prerequisites:
  - reg_glm_links
  assessment_stems:
  - Interpret an interaction term in a logistic model at three covariate values using predicted probabilities.
  - Explain why a polynomial fit extrapolates dangerously, and show it on held-out range.
  - Compute and plot an average marginal effect from posterior draws.
- id: reg_splines_gams
  title: Splines and Gaussian-Additive Smooths
  description: Use basis expansions and penalized splines to fit smooth nonlinear relationships with controlled
    wiggliness.
  bloom: create
  difficulty: 4
  est_minutes: 55
  prerequisites:
  - reg_interactions_nonlinearity
  - prior_elicitation
  assessment_stems:
  - Fit a P-spline to a nonlinear trend and show how the smoothing prior controls wiggliness.
  - Explain the role of knot count versus the penalty prior; which matters more and why?
  - Compare a spline fit to a Gaussian process fit on the same data and state the trade-offs.
- id: reg_measurement_missing
  title: Measurement Error and Missing Data
  description: Model measurement error and missingness generatively instead of deleting or imputing naively.
  bloom: create
  difficulty: 4
  est_minutes: 55
  prerequisites:
  - reg_linear_bayesian
  - gen_model_writing
  assessment_stems:
  - Write a model where a predictor is observed with known error and show the effect on the slope posterior.
  - Contrast MCAR, MAR, and MNAR and say which one complete-case analysis needs.
  - Explain why Bayesian imputation of a missing outcome is just marginalization.
- id: hier_partial_pooling
  title: 'Partial Pooling: No Pooling, Complete Pooling, and Between'
  description: Explain hierarchical shrinkage as a compromise between pooled and separate estimates.
  bloom: analyze
  difficulty: 3
  est_minutes: 60
  prerequisites:
  - reg_linear_bayesian
  - bayes_sequential_updating
  assessment_stems:
  - Fit all three pooling strategies to grouped data and plot the shrinkage of small-group estimates.
  - Why do small groups shrink more than large ones? Show the algebra for the Normal-Normal case.
  - A manager says shrinkage 'hides real differences.' Give the bias-variance answer.
- id: hier_varying_intercepts_slopes
  title: Varying Intercepts and Varying Slopes
  description: Build multilevel models with group-varying intercepts and slopes and a correlation structure
    between them.
  bloom: create
  difficulty: 4
  est_minutes: 65
  prerequisites:
  - hier_partial_pooling
  - tool_ppl_fitting
  assessment_stems:
  - Fit a varying-intercept, varying-slope model and interpret the intercept-slope correlation posterior.
  - Choose an LKJ prior for the correlation matrix and justify the eta value.
  - Explain what the group-level sd posterior being near zero implies.
- id: hier_group_predictors
  title: Group-Level Predictors and Cross-Level Interactions
  description: Add covariates at the group level and interpret cross-level interactions correctly.
  bloom: analyze
  difficulty: 4
  est_minutes: 50
  prerequisites:
  - hier_varying_intercepts_slopes
  assessment_stems:
  - Add a school-level funding predictor to a student-level model and interpret its coefficient.
  - Explain why a group-level predictor reduces the group-level sd rather than the residual sd.
  - Distinguish within-group and between-group effects and show how to separate them by centering.
- id: hier_nonnested_multilevel
  title: Non-Nested, Crossed, and Deep Hierarchies
  description: Model crossed and multi-way grouping structures and know their computational cost.
  bloom: create
  difficulty: 5
  est_minutes: 55
  prerequisites:
  - hier_group_predictors
  - diag_workflow_triage
  assessment_stems:
  - Specify a model with crossed product and region effects and describe the resulting design.
  - Why do deep hierarchies with few groups per level produce weakly identified variance components?
  - Give a rule of thumb for the minimum number of groups before a hierarchical level is worth it.
- id: ts_foundations
  title: 'Time Series Foundations: Stationarity, ACF, and Decomposition'
  description: Diagnose trend, seasonality, and autocorrelation, and explain stationarity and differencing.
  bloom: analyze
  difficulty: 2
  est_minutes: 55
  prerequisites:
  - prob_expectation_variance
  - reg_linear_bayesian
  assessment_stems:
  - Given an ACF and PACF plot, propose an AR or MA order and justify it.
  - Explain why a random walk is non-stationary and what differencing does to its variance.
  - Decompose a series into trend, seasonal, and remainder and state what the remainder should look like.
- id: ts_ar_arima
  title: Bayesian AR, MA, and ARIMA Models
  description: Fit autoregressive and ARIMA-style models in a Bayesian framework with priors that enforce
    stability.
  bloom: apply
  difficulty: 3
  est_minutes: 60
  prerequisites:
  - ts_foundations
  - tool_ppl_fitting
  assessment_stems:
  - Fit an AR(2) with priors keeping the roots outside the unit circle and interpret the coefficients.
  - Explain how the initial conditions are handled and why they matter for short series.
  - Show the posterior forecast fan from an ARIMA model and explain why it widens.
- id: ts_local_level_trend
  title: 'State Space Models: Local Level and Local Linear Trend'
  description: Express a series as a latent state plus observation noise and fit local level and local
    trend models.
  bloom: create
  difficulty: 4
  est_minutes: 65
  prerequisites:
  - ts_ar_arima
  - reg_measurement_missing
  assessment_stems:
  - Fit a local level model and interpret the ratio of state noise to observation noise.
  - Show how a local linear trend model handles a level shift, and where it fails.
  - Explain how missing observations are handled naturally in a state space formulation.
- id: ts_seasonality
  title: 'Seasonality: Dummy, Fourier, and Time-Varying Seasonal Effects'
  description: Represent single and multiple seasonalities and allow seasonal patterns to evolve.
  bloom: apply
  difficulty: 3
  est_minutes: 55
  prerequisites:
  - ts_local_level_trend
  assessment_stems:
  - Model weekly and yearly seasonality with Fourier terms and choose the number of harmonics.
  - Contrast a fixed seasonal dummy set with a time-varying seasonal state; when is each right?
  - Handle a series with holidays that move each year, and state the modeling choice.
- id: ts_structural_bsts
  title: Structural Time Series and BSTS-Style Decomposition
  description: Compose trend, seasonal, cycle, and regression components into an interpretable structural
    model.
  bloom: create
  difficulty: 4
  est_minutes: 60
  prerequisites:
  - ts_seasonality
  - reg_glm_links
  assessment_stems:
  - Build a structural model with trend, weekly seasonality, and a promotion regressor, then plot the
    component decomposition.
  - Explain how spike-and-slab or regularized priors handle many candidate regressors.
  - Attribute a forecast change to a specific component and defend the attribution.
- id: ts_gaussian_processes
  title: Gaussian Processes for Time Series
  description: Use GP priors with interpretable kernels to model smooth trends, periodicity, and uncertainty
    growth.
  bloom: create
  difficulty: 5
  est_minutes: 70
  prerequisites:
  - reg_splines_gams
  - ts_seasonality
  assessment_stems:
  - Compose a kernel for a smooth trend plus yearly periodicity and describe each hyperparameter's role.
  - Explain why a GP's forecast uncertainty reverts toward the prior far from data.
  - Given O(n^3) cost, name two approximations and their assumptions.
- id: ts_hierarchical_forecasting
  title: Hierarchical and Grouped Forecasting with Reconciliation
  description: Forecast many related series with shared structure and reconcile forecasts across an aggregation
    hierarchy.
  bloom: create
  difficulty: 5
  est_minutes: 60
  prerequisites:
  - hier_varying_intercepts_slopes
  - ts_structural_bsts
  assessment_stems:
  - Forecast store-level sales and reconcile them to regional and national totals; explain the coherence
    constraint.
  - Show how partial pooling across series improves forecasts for short-history series.
  - Contrast bottom-up, top-down, and optimal reconciliation and state when each wins.
- id: ts_forecast_uncertainty
  title: Forecast Distributions and Uncertainty Propagation
  description: Produce multi-step-ahead predictive distributions that propagate parameter and process
    uncertainty.
  bloom: analyze
  difficulty: 4
  est_minutes: 50
  prerequisites:
  - ppc_posterior_predictive
  - ts_ar_arima
  assessment_stems:
  - Generate 12-step-ahead predictive draws and explain each source contributing to the widening fan.
  - Show why plugging in posterior mean parameters understates forecast uncertainty.
  - Compute the predictive distribution of a cumulative 12-month total, not just each month.
- id: ts_backtesting
  title: 'Backtesting: Rolling Origin and Time Series Cross-Validation'
  description: Evaluate forecasts with rolling-origin or expanding-window schemes that respect time order.
  bloom: evaluate
  difficulty: 4
  est_minutes: 55
  prerequisites:
  - ts_forecast_uncertainty
  - cmp_waic_loo
  assessment_stems:
  - Design a rolling-origin backtest for a daily series with weekly seasonality and a 14-day horizon.
  - Explain a concrete leakage path in a naive k-fold split of a time series.
  - Report scores by horizon and explain why an average over horizons can mislead.
- id: ts_scoring_rules
  title: 'Proper Scoring Rules: Log Score, CRPS, and Interval Scores'
  description: Score probabilistic forecasts with proper rules and explain why impropriety invites gaming.
  bloom: evaluate
  difficulty: 4
  est_minutes: 60
  prerequisites:
  - ts_backtesting
  - cmp_predictive_view
  assessment_stems:
  - Compute CRPS for a sample-based predictive distribution and compare to MAE of the median.
  - Show that a scoring rule like MAPE is improper or degenerate, and construct a forecast that games
    it.
  - A model wins on CRPS but loses on log score. Explain what that reveals about its tails.
- id: ts_calibration_sharpness
  title: Forecast Calibration and Sharpness
  description: Assess calibration with PIT histograms and coverage, and balance it against sharpness.
  bloom: evaluate
  difficulty: 4
  est_minutes: 50
  prerequisites:
  - ts_scoring_rules
  assessment_stems:
  - Plot a PIT histogram for 500 forecasts; a U-shape appears. Diagnose the cause.
  - State the 'sharpness subject to calibration' principle and give a forecast that is calibrated but
    useless.
  - Report empirical coverage of 50% and 90% intervals by horizon and interpret the pattern.
- id: ts_intermittent_counts
  title: Intermittent Demand, Counts, and Zero Inflation
  description: Forecast sparse, zero-heavy, or count-valued series with appropriate likelihoods.
  bloom: apply
  difficulty: 4
  est_minutes: 45
  prerequisites:
  - ts_structural_bsts
  - reg_glm_links
  assessment_stems:
  - Model a series that is zero on 70% of days and justify the likelihood choice.
  - Explain why a Normal forecast interval is wrong for low counts, with a numeric example.
  - Distinguish structural zeros from sampling zeros in a demand series.
- id: ts_changepoints_regimes
  title: Changepoints, Regime Shifts, and Structural Breaks
  description: Detect and model level shifts, trend breaks, and regime switching in a Bayesian framework.
  bloom: create
  difficulty: 5
  est_minutes: 55
  prerequisites:
  - ts_local_level_trend
  - ppc_residuals_misfit
  assessment_stems:
  - Fit a model with an unknown changepoint location and report the posterior over the changepoint.
  - Contrast an explicit changepoint model with a state space model whose state noise is large.
  - Explain the forecasting risk of fitting a break that is really noise.
- id: dec_loss_functions
  title: 'Decision Theory: Loss Functions and Optimal Actions'
  description: Choose actions that minimize expected posterior loss instead of reporting point estimates.
  bloom: create
  difficulty: 4
  est_minutes: 55
  prerequisites:
  - bayes_posterior_summaries
  - ppc_posterior_predictive
  assessment_stems:
  - Under asymmetric loss (stockouts cost 5x overstock), derive the optimal order quantity from predictive
    draws.
  - Show that the posterior mean, median, and mode are optimal under squared, absolute, and 0-1 loss.
  - A threshold decision uses P(effect > 0) > 0.95. Restate the implied loss function.
- id: dec_value_of_information
  title: Value of Information and Deciding What to Measure
  description: Estimate how much a decision would improve with more data, and decide whether to collect
    it.
  bloom: evaluate
  difficulty: 5
  est_minutes: 45
  prerequisites:
  - dec_loss_functions
  assessment_stems:
  - Compute the expected value of perfect information for a two-option decision from posterior draws.
  - Design a Bayesian sample-size or stopping analysis based on decision quality, not power.
  - Argue why more data is sometimes not worth its cost, with numbers.
- id: dec_causal_cautions
  title: 'Causal Cautions: Confounding, Colliders, and Bayesian Humility'
  description: Recognize that Bayesian machinery does not make an observational estimate causal, and use
    DAG reasoning to pick adjustments.
  bloom: analyze
  difficulty: 4
  est_minutes: 60
  prerequisites:
  - reg_interactions_nonlinearity
  - hier_group_predictors
  assessment_stems:
  - Draw a DAG where adjusting for a collider creates bias, and show the effect in simulation.
  - A stakeholder reads a posterior slope as 'the effect of price on sales.' List the assumptions required.
  - Explain why adding every available covariate is not a safe default.
- id: dec_communication
  title: Communicating Uncertainty to Decision Makers
  description: Present posterior and predictive uncertainty in ways non-statisticians can act on.
  bloom: create
  difficulty: 3
  est_minutes: 40
  prerequisites:
  - bayes_posterior_summaries
  - ts_calibration_sharpness
  assessment_stems:
  - Rewrite a fan-chart forecast as three sentences an operations manager can act on.
  - Choose between a fan chart, a set of scenario draws, and a probability table for one audience; defend
    it.
  - Identify three ways a 95% interval is routinely misread and how your visual prevents each.
- id: workflow_bayesian_end_to_end
  title: The Bayesian Workflow End to End
  description: 'Run the full loop: model, prior check, fit, diagnose, posterior check, compare, expand,
    decide, document.'
  bloom: create
  difficulty: 5
  est_minutes: 90
  prerequisites:
  - diag_workflow_triage
  - ppc_residuals_misfit
  - cmp_stacking_averaging
  - prior_sensitivity
  - dec_communication
  assessment_stems:
  - Take a raw dataset to a documented decision, showing every workflow stage and each decision you made.
  - Given a colleague's notebook, audit which workflow stages are missing and what risk each omission
    creates.
  - Describe how you would version models and results so a fit from six months ago is reproducible.
- id: forecast_capstone
  title: 'Capstone: Production-Grade Probabilistic Forecast'
  description: Deliver a backtested, calibrated, hierarchical forecasting system with a decision layer
    and monitoring.
  bloom: create
  difficulty: 5
  est_minutes: 180
  prerequisites:
  - ts_hierarchical_forecasting
  - ts_calibration_sharpness
  - ts_changepoints_regimes
  - ts_intermittent_counts
  - dec_value_of_information
  - workflow_bayesian_end_to_end
  assessment_stems:
  - Build, backtest, and calibrate a multi-series forecast, then defend every modeling choice against
    a named alternative.
  - Define a monitoring plan that detects forecast degradation before the business does.
  - 'Present the system to a skeptical executive: what you know, what you do not, and what you would do
    next.'
misconceptions:
- id: mis_posterior_prob_of_data
  wrong_model: The p-value and the posterior probability of the hypothesis are the same number; P(data|H)
    can be read as P(H|data).
  objectives:
  - bayes_theorem
  - bayes_likelihood_function
  - bayes_credible_vs_confidence
  diagnostic: A test is positive. Sensitivity is 99%. Prevalence is 0.1%. A student says 'so there is
    a 99% chance the patient is sick.' What is the actual probability, and which conditional did the student
    flip?
- id: mis_flat_prior_is_neutral
  wrong_model: A flat or very wide prior is 'objective' and adds no information.
  objectives:
  - prior_types
  - prior_elicitation
  - prior_predictive_checks
  diagnostic: You put Uniform(-50, 50) on a logistic regression coefficient. Simulate the prior predictive.
    What proportion of simulated outcome probabilities land within 0.05 of 0 or 1, and is that a neutral
    belief?
- id: mis_prior_swamped_always
  wrong_model: With enough data the prior never matters, so prior choice is never worth arguing about.
  objectives:
  - prior_sensitivity
  - hier_partial_pooling
  - cmp_bayes_factors
  diagnostic: You have 500,000 rows but 8 groups at the top hierarchical level, and a near-separated logistic
    term. Name two parameters where the prior still drives the answer, and explain why n did not help.
- id: mis_more_draws_fixes_bias
  wrong_model: If the sampler shows problems, running more iterations will fix it.
  objectives:
  - diag_rhat
  - diag_ess_mcse
  - diag_divergences
  - diag_workflow_triage
  diagnostic: A run has R-hat 1.4 and 300 divergences. You rerun with 10x the draws and R-hat is still
    1.35. What class of problem is this, and what is the correct next action?
- id: mis_rhat_means_correct
  wrong_model: R-hat near 1.00 and high ESS mean the model is correct.
  objectives:
  - diag_rhat
  - ppc_checks
  - cmp_predictive_view
  diagnostic: A Normal model fitted to strictly positive, heavily skewed counts converges perfectly, with
    R-hat 1.00 everywhere. What does convergence actually certify, and which check would expose the misfit?
- id: mis_divergences_ignorable
  wrong_model: A few divergences are a cosmetic sampler warning and can be ignored if the trace looks
    fine.
  objectives:
  - diag_divergences
  - mcmc_reparameterization
  diagnostic: Your hierarchical model has 12 divergences, all with tau below 0.1. Plot tau against the
    group effects. What region of the posterior is being missed, and how does that bias your group-level
    sd estimate?
- id: mis_posterior_vs_predictive
  wrong_model: The credible interval for the mean is also the interval in which the next observation will
    fall.
  objectives:
  - ppc_posterior_predictive
  - ts_forecast_uncertainty
  - dec_communication
  diagnostic: Your posterior 95% interval for the mean daily sales is [98, 102]. What fraction of actual
    days fall in that interval, and which distribution should you have quoted?
- id: mis_plugin_forecast
  wrong_model: Forecasting means plugging the posterior mean parameters into the model and projecting
    forward.
  objectives:
  - ts_forecast_uncertainty
  - ppc_posterior_predictive
  - ts_calibration_sharpness
  diagnostic: Compare 12-step forecast intervals from (a) plug-in posterior means and (b) full predictive
    draws. Which is narrower, by roughly how much, and which source of uncertainty was dropped?
- id: mis_loo_for_timeseries
  wrong_model: LOO or k-fold cross-validation can be applied to time series the same way as to i.i.d.
    data.
  objectives:
  - cmp_waic_loo
  - ts_backtesting
  diagnostic: You run standard PSIS-LOO on a daily series with strong autocorrelation and it prefers the
    most flexible model. Explain the leakage, and design the evaluation scheme that replaces it.
- id: mis_bayes_factor_equals_loo
  wrong_model: Bayes factors and LOO answer the same question, so either can be used interchangeably.
  objectives:
  - cmp_bayes_factors
  - cmp_waic_loo
  - prior_sensitivity
  diagnostic: Widen the prior on the tested coefficient by a factor of 10. Report the change in the Bayes
    factor and the change in elpd_loo. Why does one move a lot and the other barely at all?
- id: mis_shrinkage_is_cheating
  wrong_model: Partial pooling distorts the data by pulling group estimates toward the mean, so no-pooling
    estimates are more honest.
  objectives:
  - hier_partial_pooling
  - hier_varying_intercepts_slopes
  diagnostic: One store has 3 observations and a no-pooling mean of 0.95; the global mean is 0.40. Which
    estimate has lower expected out-of-sample error next quarter, and why is 'honesty' the wrong criterion
    here?
- id: mis_accuracy_metric_is_enough
  wrong_model: A good forecast is one with low MAE or MAPE; the interval is decoration.
  objectives:
  - ts_scoring_rules
  - ts_calibration_sharpness
  - dec_loss_functions
  diagnostic: Two forecasters have identical MAE. One reports 95% intervals with 60% empirical coverage.
    Rank them by CRPS and log score, and explain which business decision changes.
- id: mis_regression_is_causal
  wrong_model: A coefficient with a posterior far from zero shows that the predictor causes the outcome,
    especially in a Bayesian model.
  objectives:
  - dec_causal_cautions
  - reg_interactions_nonlinearity
  - hier_group_predictors
  diagnostic: Price has a positive posterior slope on sales, clearly excluding zero. List the causal assumptions
    needed to act on it, and name one variable whose omission (or whose inclusion as a collider) would
    flip the sign.
- id: mis_control_for_everything
  wrong_model: Adding more covariates always reduces bias, so control for everything available.
  objectives:
  - dec_causal_cautions
  - reg_measurement_missing
  diagnostic: Simulate X -> C <- Y and regress Y on X adjusting for C. Report the estimated X coefficient
    with and without C, given that the true effect is zero. Why did adjustment create the bias?
- id: mis_vi_equals_mcmc
  wrong_model: Variational inference is just faster MCMC and gives the same posterior.
  objectives:
  - vi_basics
  - vi_advi_practice
  diagnostic: Fit a correlated 2D posterior with mean-field ADVI and with NUTS. Compare the posterior
    sds and the correlation. Which is systematically wrong, in which direction, and why does the KL direction
    cause it?

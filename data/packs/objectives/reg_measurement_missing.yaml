assessment_stems:
- Write a model where a predictor is observed with known error and show the effect on the slope posterior.
- Contrast MCAR, MAR, and MNAR and say which one complete-case analysis needs.
- Explain why Bayesian imputation of a missing outcome is just marginalization.

id: mcmc_hmc_nuts
version: 1
title: Hamiltonian Monte Carlo and NUTS
description: Explain gradient-based sampling, leapfrog integration, step size, and tree depth, and why
  HMC scales better.
bloom: analyze
difficulty: 4
est_minutes: 70
assessment_stems:
- Explain the roles of step size and number of leapfrog steps, and what happens when each is wrong.
- Why does HMC require a differentiable log density, and what does that forbid in your model?
- Contrast NUTS's automatic trajectory length with fixed-length HMC and state the trade-off.

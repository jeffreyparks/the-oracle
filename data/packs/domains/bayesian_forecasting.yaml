modules:
- id: m01_probability_foundations
  title: Probability Foundations and the Simulation Mindset
  goal: Build fluent probability language and the habit of answering questions by simulation, not formulas
    alone.
  objectives:
  - prob_sample_space_events
  - prob_conditional_independence
  - prob_random_variables
  - prob_expectation_variance
  - prob_common_distributions
  - prob_joint_marginal_transform
  - prob_mc_integration
  - tool_python_prob_stack
- id: m02_bayes_core
  title: Bayes' Theorem, Conjugacy, and Reading a Posterior
  goal: Update beliefs correctly by hand, and report posteriors in language that answers the real question.
  objectives:
  - bayes_theorem
  - bayes_likelihood_function
  - bayes_conjugacy
  - bayes_sequential_updating
  - bayes_credible_vs_confidence
  - bayes_posterior_summaries
- id: m03_priors_generative
  title: Priors, Generative Models, and Model Validation
  goal: Choose defensible priors, write full generative models, and prove the implementation is correct
    before trusting it.
  objectives:
  - prior_types
  - prior_elicitation
  - prior_predictive_checks
  - prior_sensitivity
  - gen_model_writing
  - gen_sbc_fake_data
- id: m04_computation
  title: 'Computation: MCMC and Variational Inference'
  goal: Understand and run the algorithms that make non-conjugate Bayesian inference possible.
  objectives:
  - mcmc_why_sampling
  - mcmc_markov_chains
  - mcmc_metropolis
  - mcmc_hmc_nuts
  - tool_ppl_fitting
  - tool_arviz_workflow
  - vi_basics
  - vi_advi_practice
- id: m05_diagnostics_ppc
  title: Diagnostics and Posterior Predictive Checking
  goal: Decide whether a fit is trustworthy, and whether the model can reproduce the features of the data
    you care about.
  objectives:
  - diag_trace_convergence
  - diag_rhat
  - diag_ess_mcse
  - diag_divergences
  - ppc_posterior_predictive
  - ppc_checks
  - ppc_residuals_misfit
- id: m06_regression
  title: 'Bayesian Regression: GLMs, Robustness, and Smooths'
  goal: Model a conditional mean honestly across outcome types, nonlinearity, outliers, and imperfect
    data.
  objectives:
  - reg_linear_bayesian
  - reg_glm_links
  - reg_robust_outliers
  - reg_interactions_nonlinearity
  - reg_splines_gams
  - reg_measurement_missing
- id: m07_hierarchical
  title: Hierarchical and Multilevel Models
  goal: Share strength across groups, and fix the sampling geometry that hierarchical models create.
  objectives:
  - hier_partial_pooling
  - mcmc_reparameterization
  - diag_workflow_triage
  - hier_varying_intercepts_slopes
  - hier_group_predictors
  - hier_nonnested_multilevel
- id: m08_model_comparison
  title: Model Comparison and Averaging
  goal: Compare models on expected out-of-sample predictive accuracy, and combine them rather than over-trusting
    one.
  objectives:
  - cmp_predictive_view
  - cmp_waic_loo
  - cmp_bayes_factors
  - cmp_stacking_averaging
- id: m09_time_series
  title: Bayesian Time Series and Structural Forecasting
  goal: Model time-dependent data with state space, seasonal, GP, and hierarchical structure, and produce
    honest predictive distributions.
  objectives:
  - ts_foundations
  - ts_ar_arima
  - ts_local_level_trend
  - ts_seasonality
  - ts_structural_bsts
  - ts_gaussian_processes
  - ts_intermittent_counts
  - ts_changepoints_regimes
  - ts_hierarchical_forecasting
  - ts_forecast_uncertainty
- id: m10_evaluation_decisions
  title: Forecast Evaluation, Decisions, and the Full Workflow
  goal: Prove a forecast is good with proper scores and calibration, turn it into decisions, and run the
    whole workflow end to end.
  objectives:
  - ts_backtesting
  - ts_scoring_rules
  - ts_calibration_sharpness
  - dec_loss_functions
  - dec_value_of_information
  - dec_causal_cautions
  - dec_communication
  - workflow_bayesian_end_to_end
  - forecast_capstone
misconceptions:
- id: mis_posterior_prob_of_data
  wrong_model: The p-value and the posterior probability of the hypothesis are the same number; P(data|H)
    can be read as P(H|data).
  objectives:
  - bayes_theorem
  - bayes_likelihood_function
  - bayes_credible_vs_confidence
  diagnostic: A test is positive. Sensitivity is 99%. Prevalence is 0.1%. A student says 'so there is
    a 99% chance the patient is sick.' What is the actual probability, and which conditional did the student
    flip?
- id: mis_flat_prior_is_neutral
  wrong_model: A flat or very wide prior is 'objective' and adds no information.
  objectives:
  - prior_types
  - prior_elicitation
  - prior_predictive_checks
  diagnostic: You put Uniform(-50, 50) on a logistic regression coefficient. Simulate the prior predictive.
    What proportion of simulated outcome probabilities land within 0.05 of 0 or 1, and is that a neutral
    belief?
- id: mis_prior_swamped_always
  wrong_model: With enough data the prior never matters, so prior choice is never worth arguing about.
  objectives:
  - prior_sensitivity
  - hier_partial_pooling
  - cmp_bayes_factors
  diagnostic: You have 500,000 rows but 8 groups at the top hierarchical level, and a near-separated logistic
    term. Name two parameters where the prior still drives the answer, and explain why n did not help.
- id: mis_more_draws_fixes_bias
  wrong_model: If the sampler shows problems, running more iterations will fix it.
  objectives:
  - diag_rhat
  - diag_ess_mcse
  - diag_divergences
  - diag_workflow_triage
  diagnostic: A run has R-hat 1.4 and 300 divergences. You rerun with 10x the draws and R-hat is still
    1.35. What class of problem is this, and what is the correct next action?
- id: mis_rhat_means_correct
  wrong_model: R-hat near 1.00 and high ESS mean the model is correct.
  objectives:
  - diag_rhat
  - ppc_checks
  - cmp_predictive_view
  diagnostic: A Normal model fitted to strictly positive, heavily skewed counts converges perfectly, with
    R-hat 1.00 everywhere. What does convergence actually certify, and which check would expose the misfit?
- id: mis_divergences_ignorable
  wrong_model: A few divergences are a cosmetic sampler warning and can be ignored if the trace looks
    fine.
  objectives:
  - diag_divergences
  - mcmc_reparameterization
  diagnostic: Your hierarchical model has 12 divergences, all with tau below 0.1. Plot tau against the
    group effects. What region of the posterior is being missed, and how does that bias your group-level
    sd estimate?
- id: mis_posterior_vs_predictive
  wrong_model: The credible interval for the mean is also the interval in which the next observation will
    fall.
  objectives:
  - ppc_posterior_predictive
  - ts_forecast_uncertainty
  - dec_communication
  diagnostic: Your posterior 95% interval for the mean daily sales is [98, 102]. What fraction of actual
    days fall in that interval, and which distribution should you have quoted?
- id: mis_plugin_forecast
  wrong_model: Forecasting means plugging the posterior mean parameters into the model and projecting
    forward.
  objectives:
  - ts_forecast_uncertainty
  - ppc_posterior_predictive
  - ts_calibration_sharpness
  diagnostic: Compare 12-step forecast intervals from (a) plug-in posterior means and (b) full predictive
    draws. Which is narrower, by roughly how much, and which source of uncertainty was dropped?
- id: mis_loo_for_timeseries
  wrong_model: LOO or k-fold cross-validation can be applied to time series the same way as to i.i.d.
    data.
  objectives:
  - cmp_waic_loo
  - ts_backtesting
  diagnostic: You run standard PSIS-LOO on a daily series with strong autocorrelation and it prefers the
    most flexible model. Explain the leakage, and design the evaluation scheme that replaces it.
- id: mis_bayes_factor_equals_loo
  wrong_model: Bayes factors and LOO answer the same question, so either can be used interchangeably.
  objectives:
  - cmp_bayes_factors
  - cmp_waic_loo
  - prior_sensitivity
  diagnostic: Widen the prior on the tested coefficient by a factor of 10. Report the change in the Bayes
    factor and the change in elpd_loo. Why does one move a lot and the other barely at all?
- id: mis_shrinkage_is_cheating
  wrong_model: Partial pooling distorts the data by pulling group estimates toward the mean, so no-pooling
    estimates are more honest.
  objectives:
  - hier_partial_pooling
  - hier_varying_intercepts_slopes
  diagnostic: One store has 3 observations and a no-pooling mean of 0.95; the global mean is 0.40. Which
    estimate has lower expected out-of-sample error next quarter, and why is 'honesty' the wrong criterion
    here?
- id: mis_accuracy_metric_is_enough
  wrong_model: A good forecast is one with low MAE or MAPE; the interval is decoration.
  objectives:
  - ts_scoring_rules
  - ts_calibration_sharpness
  - dec_loss_functions
  diagnostic: Two forecasters have identical MAE. One reports 95% intervals with 60% empirical coverage.
    Rank them by CRPS and log score, and explain which business decision changes.
- id: mis_regression_is_causal
  wrong_model: A coefficient with a posterior far from zero shows that the predictor causes the outcome,
    especially in a Bayesian model.
  objectives:
  - dec_causal_cautions
  - reg_interactions_nonlinearity
  - hier_group_predictors
  diagnostic: Price has a positive posterior slope on sales, clearly excluding zero. List the causal assumptions
    needed to act on it, and name one variable whose omission (or whose inclusion as a collider) would
    flip the sign.
- id: mis_control_for_everything
  wrong_model: Adding more covariates always reduces bias, so control for everything available.
  objectives:
  - dec_causal_cautions
  - reg_measurement_missing
  diagnostic: Simulate X -> C <- Y and regress Y on X adjusting for C. Report the estimated X coefficient
    with and without C, given that the true effect is zero. Why did adjustment create the bias?
- id: mis_vi_equals_mcmc
  wrong_model: Variational inference is just faster MCMC and gives the same posterior.
  objectives:
  - vi_basics
  - vi_advi_practice
  diagnostic: Fit a correlated 2D posterior with mean-field ADVI and with NUTS. Compare the posterior
    sds and the correlation. Which is systematically wrong, in which direction, and why does the KL direction
    cause it?
